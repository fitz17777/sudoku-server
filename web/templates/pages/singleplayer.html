{{define "title"}}Sudoku — Thorium Games{{end}}
{{define "content"}}
<h1>Sudoku — Choose a Difficulty</h1>
<div style="display:flex; flex-direction:column; gap:1rem; max-width:480px;">
  {{range .Difficulties}}
  <a href="/play/solo/{{.}}" class="card" style="display:flex; align-items:center; justify-content:space-between; text-decoration:none; color:inherit;">
    <div>
      <h2 style="margin:0;">{{difficultyLabel .}}</h2>
      <span style="color:#94a3b8; font-size:0.85rem;">Up to {{basePoints .}} × 2 pts</span>
    </div>
    <span class="btn btn-primary">Play</span>
  </a>
  {{end}}
</div>
{{end}}
{{template "layout/base.html" .}}
