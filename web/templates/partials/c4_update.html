<div id="c4-board" class="c4-board" hx-swap-oob="true">
  {{range $r := seq 6}}{{range $c := seq 7}}
  <div id="c4-{{$r}}-{{$c}}"
       class="c4-cell {{c4PlayerClass (index (index $.Board $r) $c)}}{{if isWinCell $.WinCells $r $c}} win-cell{{end}}">
  </div>
  {{end}}{{end}}
</div>
<span id="c4-status" hx-swap-oob="true" style="font-size:0.95rem; color:#94a3b8;">{{.TurnName}}</span>
