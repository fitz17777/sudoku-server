{{/* Opponent score panel for side-by-side mode — OOB-swaps into #opp-score-panel.
     Data: Game (acting player's GameState), OOB bool */}}
<div id="opp-score-panel"
     {{if .OOB}}hx-swap-oob="true"{{end}}
     style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center;">
  {{range .Game.Players}}
  <span style="display:flex; align-items:center; gap:0.3rem; background:#1e293b; padding:0.2rem 0.6rem; border-radius:0.375rem;">
    <span class="badge badge-{{.Color}}" style="margin-right:0.2rem;">{{.DisplayName}}</span>
    {{$m := .Mistakes}}
    {{range $i := seq 3}}<span style="color:{{if lt $i (sub 3 $m)}}#ef4444{{else}}#334155{{end}}; font-size:1.1rem;">&#9829;</span>{{end}}
    <strong style="color:#60a5fa; font-family:monospace; font-size:0.95rem; margin-left:0.3rem;">{{.Score}} pts</strong>
  </span>
  {{end}}
</div>
